name: opera-conductor

services:
  # ── Oracle XE ────────────────────────────────────────────────────────────────
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: opera-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: system # kept for reference; system user already exists
    ports:
      - '1521:1521'
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ── Kafka (KRaft — no Zookeeper) ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: opera-kafka
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Auto-create topics (dev convenience)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'opera-conductor-cluster-1'
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka topic initialiser (runs once then exits) ───────────────────────────
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: opera-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        for topic in \
          oracle-hospitality-events \
          data-sim-deadletter-dev \
          logs-simphony-streamburner; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$topic \
            --partitions 3 --replication-factor 1
          echo "Topic $$topic ready"
        done

  # ── MailHog (local SMTP + web UI) ────────────────────────────────────────────
#  mailhog:
#    image: mailhog/mailhog:v1.0.1
#    container_name: opera-mailhog
#    ports:
#      - "1025:1025"   # SMTP (app points to :25 — map if needed, or change app config to 1025)
#      - "8025:8025"   # Web UI  →  http://localhost:8025

volumes:
  oracle-data:
  kafka-data:
